# bible-sources.yaml — per-language canonical Bible source config.
# Read by scripts/verify/scripture-per-language.js (Phase 3.5) when a
# translation study cites a scripture verse. Enforces: the target-language
# rendering is verbatim from the configured Bible source, and the source-
# language rendering (usually English) matches translation_of.scripture_anchor.
#
# Design per ADR 2026-08-12-translation-studies.md §7.3 and §2.4.
#
# Each language has:
#   - primary: source used TODAY (public-domain, safe to publish)
#   - upgrade_candidates (optional): contemporary sources we may anchor to.
#     Two kinds:
#       * permission-pending — needs a grant. When a study uses one,
#         study.yaml.rights_tier must be 'private_pending_grant' until the grant
#         lands, and verify-release blocks public publish.
#       * open licence (CC-BY-SA-4.0) — no grant needed. A study anchored to one
#         is published as its own edition licensed 'cc-by-sa-4.0' (ADR §2.4);
#         edition_license says so. These stay 'private_pending_grant' as well
#         until the licence is enforced end to end (publish_blocked_until):
#         today every publish path stamps CC BY 4.0, which would breach
#         ShareAlike.
#
# Where the open texts live, their hashes and licence evidence:
#   loqu8/strongs docs/bible-sources-licensing.md and docs/open-bibles.tsv.

en:
  primary:
    id: kjv-1769
    citation: "King James Version, 1769 Oxford standard"
    license: PD
  upgrade_candidates: []      # KJV suffices for period-appropriate use with Bunyan/Puritan sources
  api:
    local_cache: loqu8/bible sqlite (KJV)

he:
  # Old Testament (Tanakh) + New Testament handled separately in Hebrew.
  tanakh:
    id: sefaria-masoretic
    citation: "Masoretic Text via Sefaria (Aleppo/Leningrad tradition)"
    license: PD
    api: https://www.sefaria.org/api/texts/
  nt:
    id: delitzsch-12ed
    citation: "Franz Delitzsch, Hebrew New Testament, 12th edition"
    license: PD
    api: local-cache
  upgrade_candidates:
    - id: heblb-biblica
      citation: "Hebrew Living New Testament (הברית החדשה/הדרך), Biblica, Inc. © 1979, 2009"
      covers: nt            # no open modern-Hebrew OT exists; OT stays Masoretic
      license: CC-BY-SA-4.0
      source: "eBible heblb; BibleNLP corpus heb-heblb.txt"
      note: >-
        Licence rests on its eBible copyright page (creativecommons.org/licenses/by-sa/4.0);
        Biblica's 2026-08-31 email covered only the Arabic and Persian texts.
      rights_tier_when_used: private_pending_grant
      publish_blocked_until: edition-licence-enforcement
      edition_license: cc-by-sa-4.0
    - id: kalisher-bsi-contemporary-2025
      citation: "Kalisher Contemporary Hebrew, BSI 2025 (both OT+NT)"
      note: "First modern-Hebrew OT, launched 2025-11-20"
      license: permission-pending
      contact: "BSI (Bible Society in Israel) — letter sent 2026-08-12; response 10-15 bus days"
      rights_tier_when_used: private_pending_grant

ar:
  primary:
    id: van-dyck-svd-1865
    citation: "Van Dyck / Smith-Van Dyck Arabic Bible, 1865 (SVD)"
    license: PD
  upgrade_candidates:
    - id: nav-biblica
      citation: "New Arabic Version (NAV, Ketab El Hayat), Biblica, Inc. © 1988, 1997, 2012"
      license: CC-BY-SA-4.0
      source: "eBible arbnav; BibleNLP corpus arb-arbnav.txt"
      note: >-
        Biblica Rights & Permissions (email to tim@gig8.com, 2026-08-31): no permission
        request or agreement needed; use under CC BY-SA. No BY-compatible grant is
        offered, so an NAV-anchored study is a CC-BY-SA edition (ADR §2.4).
      rights_tier_when_used: private_pending_grant
      publish_blocked_until: edition-licence-enforcement
      edition_license: cc-by-sa-4.0

fa:
  primary:
    id: henry-martyn-nt-1837
    citation: "Henry Martyn Persian New Testament, 1837"
    license: PD
  upgrade_candidates:
    - id: opcb-biblica
      citation: "Open Persian Contemporary Bible, Biblica, Inc. © 1995, 2005, 2018, 2022"
      license: CC-BY-SA-4.0
      source: "eBible pesopcb; BibleNLP corpus pes-pesopcb.txt"
      note: "Covered by the same 2026-08-31 Biblica reply as the NAV."
      rights_tier_when_used: private_pending_grant
      publish_blocked_until: edition-licence-enforcement
      edition_license: cc-by-sa-4.0
    - id: elam-pmv
      citation: "Elam Ministries Persian Modern Version (PMV)"
      note: >-
        Elam correspondence (Golnar Jamieson, 2026-08) concerns the New Millennium
        Version (NMV); confirm which text this id means. Grants go via DBL to
        organisations; call proposed 16/17 Sep 2026.
      license: permission-pending
      rights_tier_when_used: private_pending_grant

zh-Hans:
  primary:
    id: cuv-1919-simplified
    citation: "Chinese Union Version, 1919, Simplified script"
    license: PD
    api: local-cache
  upgrade_candidates:
    - id: rcuv-hkbs
      citation: "Revised Chinese Union Version, HK Bible Society"
      license: permission-pending
      rights_tier_when_used: private_pending_grant

zh-Hant:
  primary:
    id: cuv-1919-traditional
    citation: "Chinese Union Version, 1919, Traditional script"
    license: PD
    api: local-cache
  upgrade_candidates:
    - id: rcuv-hkbs
      citation: "Revised Chinese Union Version, HK Bible Society"
      license: permission-pending
      rights_tier_when_used: private_pending_grant
