name: nightly-feedback-triage

# Pulls Gmail messages labelled `lemma-feedback` into
# lemma-workroom/feedback-inbox/YYYY-MM-DD.jsonl (transport headers stripped
# per §16 minimization). Cross-repo write via LEMMA_APP_TOKEN or a
# workroom-scoped PAT.
#
# PHASE 2b: workflow scaffolded; live Gmail API + workroom clone step is
# TODO until Task 2b.4 verifies Zoho→Gmail→label end-to-end and Task 1.11
# GitHub App is installed on lemma-workroom.

on:
  schedule:
    - cron: '0 6 * * *'   # nightly 06:00 UTC (after annotations + comments)
  workflow_dispatch:

permissions:
  contents: read   # this repo; workroom write goes via the App token

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lemma-content

      # Sibling clone with cross-repo push permission.
      - name: Checkout lemma-workroom (App-scoped token)
        uses: actions/checkout@v4
        with:
          repository: lemma-studies/lemma-workroom
          path: lemma-workroom
          token: ${{ secrets.LEMMA_WORKROOM_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: lemma-content
        run: npm ci --omit=optional || npm install

      - name: Export Gmail feedback
        working-directory: lemma-content
        env:
          GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}
          WORKROOM_PATH: ${{ github.workspace }}/lemma-workroom
        run: node scripts/export-feedback.mjs

      - name: Commit to workroom if changed
        working-directory: lemma-workroom
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback-inbox/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(feedback): nightly triage $(date -u +%F)"
          git push
