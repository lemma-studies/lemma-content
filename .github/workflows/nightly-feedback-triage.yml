name: nightly-feedback-triage

# Pulls Gmail messages labelled `lemma-feedback` into
# lemma-workroom/feedback-inbox/YYYY-MM-DD.jsonl (transport headers stripped
# per §16 minimization). Cross-repo write via LEMMA_APP_TOKEN or a
# workroom-scoped PAT.
#
# PHASE 2b: workflow scaffolded; live Gmail API + workroom clone step is
# TODO until Task 2b.4 verifies Zoho→Gmail→label end-to-end and Task 1.11
# GitHub App is installed on lemma-workroom.

on:
  schedule:
    - cron: '0 6 * * *'   # nightly 06:00 UTC (after annotations + comments)
  workflow_dispatch:

permissions:
  contents: read   # this repo; workroom write goes via the App token

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lemma-content

      # Mint an installation token for lemma-studies-bot (App ID 4566459),
      # scoped to the workroom repo only (least-privilege — App has access to
      # all lemma-* repos but we only need workroom for this step).
      # LEMMA_BOT_APP_ID + LEMMA_BOT_PRIVATE_KEY are org-level (see
      # /mnt/a/gig8/github-app-credentials.md); free-plan clamp restricts
      # org secrets to public repos, and lemma-content IS public.
      - name: Mint App installation token (workroom)
        uses: actions/create-github-app-token@v1
        id: workroom-token
        with:
          app-id: ${{ vars.LEMMA_BOT_APP_ID }}
          private-key: ${{ secrets.LEMMA_BOT_PRIVATE_KEY }}
          owner: lemma-studies
          repositories: lemma-workroom

      # Sibling clone with cross-repo push permission via the App-minted token.
      # Commits show as authored by lemma-studies-bot[bot] — clean audit trail.
      - name: Checkout lemma-workroom (App-scoped token)
        uses: actions/checkout@v4
        with:
          repository: lemma-studies/lemma-workroom
          path: lemma-workroom
          token: ${{ steps.workroom-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: lemma-content
        run: npm ci --omit=optional || npm install

      - name: Export Gmail feedback
        working-directory: lemma-content
        env:
          GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}
          WORKROOM_PATH: ${{ github.workspace }}/lemma-workroom
        run: node scripts/export-feedback.mjs

      - name: Commit to workroom if changed
        working-directory: lemma-workroom
        run: |
          # Commit identity matches the App-minted token so the push authenticates
          # as lemma-studies-bot[bot] — clean audit trail per §6.4. The bot email
          # follows the GitHub convention: <app-id>+<app-slug>[bot]@users.noreply.github.com
          git config user.name "lemma-studies-bot[bot]"
          git config user.email "${{ vars.LEMMA_BOT_APP_ID }}+lemma-studies-bot[bot]@users.noreply.github.com"
          git add feedback-inbox/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(feedback): nightly triage $(date -u +%F)"
          git push
